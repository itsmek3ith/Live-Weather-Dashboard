<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Radar - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="main-header">
            <div class="brand">🌤️ Weather Radar</div>
            <nav class="nav-links">
                <a href="index.html" class="nav-item active">Dashboard</a>
                <a href="favorites.html" class="nav-item">My Favorites</a>
            </nav>
        </header>
        <main class="dashboard-main">
            <form class="weatherForm">
                <input type="text" class="cityInput" placeholder="Search a global city...">
                <button type="submit" class="btn-primary">Search</button>
            </form>
            <div class="card"></div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
